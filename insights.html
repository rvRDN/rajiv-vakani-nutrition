  <script>
    document.addEventListener('DOMContentLoaded', function () {
      /* Standard nav + mobile menu behavior — matches every other page on the site. */
      const menuToggle = document.querySelector('.menu-toggle');
      const navLinks = document.querySelector('.nav-links');
      const overlay = document.querySelector('.mobile-menu-overlay');
      const mainNav = document.querySelector('.main-nav');
      const heroSection = document.querySelector('.insights-hero');

      function handleNavScroll() {
        if (heroSection && mainNav) {
          const heroBottom = heroSection.offsetTop + heroSection.offsetHeight;
          const scrollPosition = window.pageYOffset + 100;
          if (scrollPosition > heroBottom) {
            mainNav.classList.add('scrolled');
          } else {
            mainNav.classList.remove('scrolled');
          }
        }
      }
      window.addEventListener('scroll', handleNavScroll);

      if (menuToggle && navLinks) {
        menuToggle.addEventListener('click', function () {
          navLinks.classList.toggle('active');
          menuToggle.classList.toggle('active');
          if (overlay) overlay.classList.toggle('active');
        });
        if (overlay) {
          overlay.addEventListener('click', function () {
            navLinks.classList.remove('active');
            menuToggle.classList.remove('active');
            overlay.classList.remove('active');
          });
        }
        navLinks.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', function () {
            navLinks.classList.remove('active');
            menuToggle.classList.remove('active');
            if (overlay) overlay.classList.remove('active');
          });
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && navLinks.classList.contains('active')) {
            navLinks.classList.remove('active');
            menuToggle.classList.remove('active');
            if (overlay) overlay.classList.remove('active');
          }
        });
      }
    });

    /* ============================================================
       INLINE FALLBACK for local file:// preview.
       ============================================================

       The page reads from insights/articles.json at runtime. When the site is
       served over HTTP (Netlify in production, or a local server like
       `python -m http.server` during development), this constant is never
       used — the JSON file on disk is the source of truth.

       When the page is opened directly via file:// in a browser, fetch() of
       the local JSON file is blocked by browser security policy. This inline
       constant exists so the page still renders identically in that case,
       which is essential for previewing the layout without setting up a
       local web server.

       KEEP THIS IN SYNC WITH insights/articles.json IF PREVIEWING VIA file://.
       If you preview via a local HTTP server, you can ignore this constant
       entirely — the live JSON will always win.

       Quick ways to preview over HTTP locally (so you can edit articles.json
       directly and skip the inline-fallback maintenance burden):
         - Python:  python -m http.server 8000   →  http://localhost:8000/insights.html
         - Node:    npx serve                    →  http://localhost:3000/insights.html
         - VS Code: install the "Live Server" extension, right-click → Open with Live Server
       ============================================================ */
    const INLINE_ARTICLES_FALLBACK = [
      {
        "slug": "why-i-stopped-trusting-simple-answers",
        "url": "insights/why-i-stopped-trusting-simple-answers.html",
        "title": "Why I Stopped Trusting Simple Answers",
        "lede": "Why simple nutrition rules often fall apart in real life, and what I started doing instead of looking for clearer ones.",
        "topics": ["nutrition advice", "simple answers", "elimination diets", "seed oils", "evidence quality", "changing your mind"],
        "scale": "lasting",
        "status": "published"
      },
      {
        "slug": "what-dr-gundry-taught-me",
        "url": "insights/what-dr-gundry-taught-me.html",
        "title": "What Dr. Gundry Taught Me Even Though I Don't Follow His Advice",
        "lede": "Five months on a lectin-restricted diet, what improved, what didn't, and what stayed with me after I stopped.",
        "topics": ["Dr. Steven Gundry", "lectins", "elimination diets", "nutrition authority", "self-experimentation", "changing your mind"],
        "scale": "currently",
        "status": "published"
      },
      {
        "slug": "how-i-evaluate-nutrition-claims",
        "url": "insights/how-i-evaluate-nutrition-claims.html",
        "title": "How I Evaluate Nutrition Claims",
        "lede": "The questions I return to when a confident nutrition claim catches my attention.",
        "topics": ["nutrition claims", "evidence quality", "nutrition research", "seed oils", "study design", "changing your mind"],
        "scale": "lasting",
        "status": "published"
      }
    ];

    /* Render the curated stream from insights/articles.json (or inline fallback on file://).
       Filters: status === 'published'.
       (A future Gravitational Stream visibility filter — e.g. excluding scale === 'quiet' —
       can be added on the line marked below when the library grows past ~10 pieces.) */
    (async function renderInsightsStream() {
      const container = document.querySelector('[data-insights-stream]');
      if (!container) return;

      function escapeHTML(str) {
        const div = document.createElement('div');
        div.textContent = String(str == null ? '' : str);
        return div.innerHTML;
      }

      let articles = null;
      let source = 'unknown';

      if (location.protocol === 'file:') {
        /* Local file:// preview — skip fetch and use the inline copy. */
        articles = INLINE_ARTICLES_FALLBACK;
        source = 'inline fallback (file:// preview)';
      } else {
        try {
          const response = await fetch('insights/articles.json', { cache: 'no-cache' });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          articles = await response.json();
          source = 'articles.json (live)';
        } catch (err) {
          console.warn('Could not load insights/articles.json; falling back to inline copy.', err);
          articles = INLINE_ARTICLES_FALLBACK;
          source = 'inline fallback (fetch error)';
        }
      }

      if (source.indexOf('inline') === 0) {
        console.info('[Insights] Rendered from ' + source + '. The source of truth is insights/articles.json — keep the inline INLINE_ARTICLES_FALLBACK in insights.html in sync if you preview via file://, or serve the site over HTTP to skip that step.');
      }

      const visible = articles.filter(a => a && a.status === 'published');
      /* Future: && a.scale !== 'quiet'  ← enable when the library grows. */

      if (visible.length === 0) {
        container.innerHTML = '<p class="insights-stream__empty">No pieces published yet.</p>';
        return;
      }

      const html = visible.map(article => {
        const safeTitle = escapeHTML(article.title);
        const safeLede = escapeHTML(article.lede);
        const safeUrl = escapeHTML(article.url);
        return [
          '<article class="insights-stream__entry">',
            '<h2 class="insights-stream__title">',
              '<a href="' + safeUrl + '">' + safeTitle + '</a>',
            '</h2>',
            '<p class="insights-stream__lede">' + safeLede + '</p>',
          '</article>'
        ].join('');
      }).join('');

      container.innerHTML = html;
    })();
  </script>
