<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rajiv Vakani | Nutrition, Culture & Clarity</title>
  <meta name="description" content="Rajiv Vakani's official site. Explore grounded insights into food systems, culture, and modern nutrition.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Lora:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="rajiv-styles.css?v=20250716" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    /* Minimal modular hero override */
    .hero-refresh {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 80px 20px;
      background: linear-gradient(135deg, #f0f4f8 0%, #ffffff 100%);
      position: relative;
      overflow: hidden;
    }
    .hero-refresh h1 {
      font-family: 'Lora', serif;
      font-size: 3.2em;
      font-weight: 700;
      color: var(--primary-blue);
      margin-bottom: 20px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s ease forwards 0.2s;
    }
    .hero-refresh p {
      font-size: 1.25em;
      max-width: 750px;
      margin: 0 auto 30px;
      color: var(--medium-text);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s ease forwards 0.4s;
    }
    .hero-refresh .button {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s ease forwards 0.6s;
    }
    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <nav class="main-nav">
    <div class="container nav-container">
      <a href="index.html" class="site-logo">Rajiv Vakani</a>
      <button class="menu-toggle" aria-label="Toggle navigation">
        <span class="hamburger"></span>
        <span class="hamburger"></span>
        <span class="hamburger"></span>
      </button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="table-talk.html">Table Talk</a></li>
        <li><a href="no-onion-no-garlic.html">No Onion, No Garlic</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="#contact-form">Contact</a></li>
      </ul>
    </div>
  </nav>

  <header class="hero-refresh">
    <h1>Food Wisdom for Modern Lives</h1>
    <p>Honest, evidence-based insights on what we eat, why it matters, and how small changes can shape health and clarity — without gimmicks or guilt.</p>
    <a href="#explore-newsletters" class="button">Explore the Newsletters →</a>
  </header>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const menuToggle = document.querySelector('.menu-toggle');
      const navLinks = document.querySelector('.nav-links');
      if (menuToggle && navLinks) {
        menuToggle.addEventListener('click', function () {
          navLinks.classList.toggle('active');
          menuToggle.classList.toggle('active');
        });
        navLinks.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', function () {
            navLinks.classList.remove('active');
            menuToggle.classList.remove('active');
          });
        });
      }
    });
  </script>
</body>
</html>
