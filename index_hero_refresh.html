<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rajiv Vakani | Nutrition, Culture & Clarity</title>
  <meta name="description" content="Rajiv Vakani's official site. Explore grounded insights into food systems, culture, and modern nutrition.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Lora:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="rajiv-styles.css?v=20250716" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    :root {
      --ink: #1c1d1f;
      --warm-bg: #f8f5f1;
      --accent: #b75d3a;
    }

    body {
      background-color: var(--warm-bg);
    }

    .hero-refresh {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding: 100px 40px;
      background-color: var(--warm-bg);
      background-image: radial-gradient(rgba(0, 0, 0, 0.015) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .hero-text {
      flex: 1;
      max-width: 600px;
    }

    .hero-text h1 {
      font-family: 'Lora', serif;
      font-size: 2.9em;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 10px;
    }

    .hero-text h1 + h2 {
      font-family: 'Lora', serif;
      font-size: 1.25em;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 40px;
    }

    .hero-text p {
      font-size: 1.05em;
      font-family: 'Inter', sans-serif;
      color: var(--ink);
      margin-bottom: 35px;
      line-height: 1.6;
    }

    .button {
      background-color: var(--accent);
      color: #fff;
      padding: 15px 30px;
      font-size: 1em;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      text-decoration: none;
      display: inline-block;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .button:hover {
      background-color: #9b4427;
      transform: translateY(-2px);
    }

    .hero-visual {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 300px;
    }

    .hero-visual .shape {
      width: 280px;
      height: 280px;
      background: var(--accent);
      border-radius: 60% 40% 30% 70% / 50% 30% 70% 50%;
      opacity: 0.15;
      animation: floatShape 12s ease-in-out infinite;
    }

    @keyframes floatShape {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    @media (max-width: 768px) {
      .hero-refresh {
        flex-direction: column;
        padding: 60px 20px;
        text-align: center;
      }

      .hero-visual {
        margin-top: 40px;
      }
    }
  </style>
</head>
<body>
  <nav class="main-nav">
    <div class="container nav-container">
      <a href="index.html" class="site-logo">Rajiv Vakani</a>
      <button class="menu-toggle" aria-label="Toggle navigation">
        <span class="hamburger"></span>
        <span class="hamburger"></span>
        <span class="hamburger"></span>
      </button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="table-talk.html">Table Talk</a></li>
        <li><a href="no-onion-no-garlic.html">No Onion, No Garlic</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="#contact-form">Contact</a></li>
      </ul>
    </div>
  </nav>

  <header class="hero-refresh">
    <div class="hero-text">
      <h1>Most people eat with their eyes closed.</h1>
      <h2>You’re not most people.</h2>
      <p><strong>These aren’t tips.</strong><br>
      They’re patterns. Questions. Friction.<br>
      The kind that makes things click.</p>
      <a href="#explore-newsletters" class="button">Find your seat at the table →</a>
    </div>
    <div class="hero-visual">
      <div class="shape"></div>
    </div>
  </header>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const menuToggle = document.querySelector('.menu-toggle');
      const navLinks = document.querySelector('.nav-links');
      if (menuToggle && navLinks) {
        menuToggle.addEventListener('click', function () {
          navLinks.classList.toggle('active');
          menuToggle.classList.toggle('active');
        });
        navLinks.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', function () {
            navLinks.classList.remove('active');
            menuToggle.classList.remove('active');
          });
        });
      }
    });
  </script>
</body>
</html>
